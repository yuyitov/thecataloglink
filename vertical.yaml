# Brand/domain config for the "catalog" vertical — The Catalog Link
# (thecataloglink.com, comprado 2026-07-22). Producto de la vertical de
# Catálogo Digital "YA HECHO" (PLAN en Negocios Digitales/Catalogo Digital).
#
# ⚠️ ID CONGELADO (P-CAT-F4, 2026-07-23): `catalog`. Este id prefija el KV, el
# worker y el repo de esta vertical. El nombre provisional `catalink`/`catalog`
# quedó decidido al comprar la marca The Catalog Link. NO renombrar.
#
# 🚫 NO ES E-COMMERCE (decisión de producto CERRADA, PLAN §F4). El catálogo NO
# tiene carrito, checkout, inventario ni envíos. Es una vitrina estática que
# empuja el pedido a un botón de venta (WhatsApp / SMS / llamada). Ninguna
# sesión futura debe "mejorarlo" hacia una tienda: si aparece esa idea, es un
# producto distinto, no esta vertical. (También anotado en docs/CATALOG.md.)
id: catalog
brand_name: "The Catalog Link"
domain: "https://www.thecataloglink.com"

# F4: esta vertical renderiza con la SEGUNDA plantilla base del engine
# (catalog), no con service-menu. Ver engine/generator/vertical_config.py
# (KNOWN_TEMPLATES) y scripts/build_vertical.py (GENERATOR_FOR_TEMPLATE).
template: catalog

# Estilos = layout + paleta. El nombre codifica <layout>-<paleta>; el generador
# deriva el LAYOUT del prefijo (vitrina / revista / elegante → una plantilla
# estructural por layout) y el CSS es solo la paleta. Meta del PLAN COMPLETA:
# 12 estilos = 3 layouts × 4 paletas. P-CAT-F4 (paso 1-2) entregó Vitrina;
# P-CAT-F4-estilos (paso 3) agrega Revista (editorial, foto grande) y Elegante
# (oscuro, joyería/velas), cada uno con sus 4 paletas. Cada nombre debe tener su
# engine/generator/styles/<nombre>.css y su templates/catalog-<layout>.html.
styles:
  catalog:
    # Vitrina — grid luminoso (comida, muchos productos)
    - vitrina-crema
    - vitrina-durazno
    - vitrina-rosa
    - vitrina-salvia
    # Revista — editorial, foto grande (florería, charcutería, gourmet)
    - revista-crema
    - revista-durazno
    - revista-rosa
    - revista-salvia
    # Elegante — oscuro (joyería, velas, perfumería, piezas de autor)
    - elegante-onix
    - elegante-vino
    - elegante-esmeralda
    - elegante-medianoche

# Sin overrides de strings: la plantilla catalog usa las claves catalog_* de
# la base (engine/generator/strings_base.py). ES/EN parity obligatoria.
strings_overrides:
  es: {}
  en: {}

# La plantilla catalog no usa el registro de bloques condicionales de
# service-menu; se deja en el default del engine.
blocks:
  # ACTIVACION del vCard (linkFactory/22). Ver la nota larga en
  # verticals/hmu/vertical.yaml. Aqui hubo trabajo extra y conviene que quede
  # dicho: al medir el 2026-07-30 se vio que encender el bloque en esta
  # vertical NO habria producido ningun boton, porque el catalogo se renderiza
  # con otra plantilla base donde el bloque no existia. Se porto (misma
  # `make_vcard`, mismas clases que las 3 plantillas ya declaran). El telefono
  # sale del `sale_button`, que es el numero publico que el catalogo captura.
  vcard:
    enabled_for: all
  # ACTIVACION del pase de Google Wallet (linkFactory/18). Ver la nota larga en
  # el vertical.yaml de HMU Link. Aqui vale la misma advertencia que dejo el
  # vCard: el catalogo se renderiza con OTRA plantilla base, asi que encender el
  # bloque solo produce boton porque generate_catalog.py tambien lo cablea. El
  # telefono del pase sale del `sale_button`, que es el numero publico que el
  # catalogo captura.
  wallet_google:
    enabled_for: all

# Cómo se LEE el intake de esta vertical (ver INTAKE_DEFAULTS en
# vertical_config.py). El worker extrae estos campos como texto —solo porque el
# tally-field-aliases.json de al lado los declara— y aquí se dice en qué se
# convierten. Una vertical que no abre esta sección no gana ni una clave.
intake:
  fields:
    # linkFactory/17 (2026-07-27). De las 12 preguntas del formulario VIVO del
    # catálogo, ésta era la única que se contestaba y no llegaba a ningún campo
    # del worker. Es el consentimiento de derechos de imagen del camino
    # ORGÁNICO —el único donde el negocio sube SUS fotos— y vivía SOLO en el
    # blob crudo del intake, que expira a los 90 días (expirationTtl 7776000),
    # mientras que la página publicada con esas fotos es PERMANENTE. La única
    # prueba de un consentimiento no puede expirar antes que el uso que ampara
    # (mismo dictamen de pawcontact/6, cerrado en linkFactory/16).
    #
    # Van las DOS declaraciones o no sirve ninguna: el alias de al lado hace que
    # el WORKER lo extraiga al payload, y esta línea hace que
    # build_client_from_intake lo ESCRIBA al client.json. Con solo la primera,
    # el campo llega al payload y se tira ahí mismo.
    #
    # NO se declara `schema.require_true` (ModaLink sí lo hace). Ahí la casilla
    # es un gate: sin ella el generador se niega a publicar. Aquí sería falso
    # rigor — la pregunta solo se MUESTRA en el camino orgánico (show_when
    # catalog_mode), así que un cliente del camino prellenado, que nunca la ve,
    # se quedaría sin página. Sin contestar queda `false`, que es la verdad
    # ("nadie confirmó"): lo que no puede pasar es que quede `true` por default.
    photo_rights_confirmed: {kind: yes_no}

# Datos legales de la vertical (Ola 1b). Reúso del mismo mecanismo de la
# fábrica. Lo que no se declare usa el default de la casa (refund_days 7,
# support_email hello@<dominio>, CFDI a solicitud, jurisdicción México).
legal:
  responsable: "Verónica Pérez Arroyo"
  domicilio_fiscal: "Virgen 5552, Arboledas, Zapopan, Jalisco, C.P. 45070, México"
  updated:
    es: "23 de julio de 2026"
    en: "July 23, 2026"
  # El catálogo publica información y fotos tomadas de perfiles públicos del
  # negocio. El disclaimer va hacia AFUERA (lo lee el cliente final) y deja
  # claro que los precios se confirman con el negocio — coherente con que casi
  # todo el catálogo dice "Preguntar precio".
  disclaimers:
    - es: "Catálogo informativo. Los productos, la disponibilidad y los precios se confirman directamente con el negocio; no es una tienda en línea."
      en: "Informational catalog. Products, availability and prices are confirmed directly with the business; this is not an online store."
